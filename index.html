<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJ 上色器 - 纹理贴图 · 导出ZIP</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111122;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
            border-left: 4px solid #ffaa00;
            font-size: 14px;
            max-width: 40vw;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 40, 0.92);
            backdrop-filter: blur(10px);
            color: white;
            padding: 16px 24px;
            border-radius: 60px;
            display: flex;
            gap: 18px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 96vw;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .control-group label {
            font-size: 12px;
            font-weight: 500;
            color: #bbb;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        input[type="color"] {
            width: 42px;
            height: 42px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 2px;
            transition: transform 0.2s, border-color 0.2s;
        }
        input[type="color"]:hover {
            transform: scale(1.05);
            border-color: #ffaa00;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        button {
            background: #ffaa00;
            border: none;
            color: #1a1a1a;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(255,170,0,0.25);
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
        }
        button:hover {
            background: #ffbb22;
            box-shadow: 0 6px 15px rgba(255,170,0,0.45);
        }
        button:active { transform: scale(0.96); }
        button.active-mode {
            background: #ff5500;
            color: white;
            box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(255,85,0,0.6);
        }
        .file-upload-wrapper {
            position: relative;
            display: inline-block;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        .file-upload-btn {
            background: #3a3a4a;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            display: inline-block;
        }
        .file-upload-btn:hover { background: #4a4a5a; }
        .export-btn {
            background: #2e8b57;
            color: white;
            box-shadow: 0 4px 10px rgba(46,139,87,0.3);
        }
        .export-btn:hover {
            background: #3cb371;
            box-shadow: 0 6px 15px rgba(46,139,87,0.5);
        }
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
            font-family: monospace;
            border-left: 3px solid #0f0;
            z-index: 10;
            max-width: 45vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa00;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            padding: 20px 40px;
            border-radius: 12px;
            pointer-events: none;
            display: none;
        }
        #texturePreview {
            position: absolute;
            bottom: 110px;
            left: 20px;
            width: 110px;
            height: 110px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.5);
            background-size: cover;
            background-position: center;
            z-index: 15;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #texturePreview.show { display: block; }
        #texturePreview::after {
            content: '纹理预览';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
        }
        .mode-switch {
            display: flex;
            background: #1e1e2a;
            border-radius: 30px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mode-switch button {
            background: transparent;
            box-shadow: none;
            color: #aaa;
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 25px;
        }
        .mode-switch button.active-mode {
            background: #ff5500;
            color: white;
            box-shadow: 0 2px 8px rgba(255,85,0,0.5);
        }
        .mode-switch button:hover {
            background: rgba(255,255,255,0.1);
        }
        .mode-switch button.active-mode:hover {
            background: #ff5500;
        }
        @media (max-width: 1000px) {
            #controls { flex-direction: column; padding: 15px; border-radius: 30px; gap: 10px; }
            .control-group { flex-wrap: wrap; justify-content: center; }
            #info { font-size: 12px; padding: 8px 14px; max-width: 60vw; }
            #status { font-size: 11px; max-width: 55vw; }
            button { padding: 8px 14px; font-size: 12px; }
            #texturePreview { width: 80px; height: 80px; bottom: 130px; }
        }
    </style>
</head>
<body>
    <div id="info">🎨 OBJ 上色器 · 点击面涂色或贴图 · 可导出ZIP</div>
    <div id="status">初始化中...</div>
    <div id="loading">⏳ 处理中...</div>
    <div id="texturePreview"></div>

    <div id="controls">
        <!-- 模式切换 -->
        <div class="mode-switch">
            <button id="modeColor" class="active-mode" title="用颜色涂面">🎨 颜色</button>
            <button id="modeTexture" title="用纹理贴面">🖼️ 纹理</button>
        </div>

        <div class="control-group">
            <label>颜色</label>
            <input type="color" id="colorPicker" value="#ff5500">
        </div>
        
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">📂 上传 OBJ</button>
            <input type="file" id="fileInput" accept=".obj">
        </div>

        <div class="file-upload-wrapper">
            <button class="file-upload-btn" style="background:#4a6a8a;">🖼️ 导入纹理</button>
            <input type="file" id="textureInput" accept="image/*">
        </div>

        <div class="control-group">
            <button id="resetColorBtn">🔄 重置</button>
            <button id="randomColorBtn">🎲 随机</button>
            <button id="exportZipBtn" class="export-btn">📦 导出 ZIP</button>
        </div>
    </div>

    <!-- 全局加载 JSZip 和 FileSaver -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <!-- Three.js importmap -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // 全局依赖
        const JSZip = window.JSZip;
        const saveAs = window.saveAs;

        if (!JSZip) console.error('JSZip 未加载');
        if (!saveAs) console.error('FileSaver 未加载');

        // --- 状态与 UI ---
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        const texturePreview = document.getElementById('texturePreview');

        function setStatus(text, isError = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = isError ? '#ff5555' : '#0f0';
            statusDiv.style.borderLeftColor = isError ? '#ff5555' : '#0f0';
        }
        function showLoading(show) {
            loadingDiv.style.display = show ? 'block' : 'none';
        }

        // --- 场景初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxDistance = 30;
        controls.minDistance = 0.5;

        // 光照
        scene.add(new THREE.AmbientLight(0x505070));
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight1.position.set(2, 5, 3);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0xffaa88, 0.8);
        dirLight2.position.set(-3, 1, -2);
        scene.add(dirLight2);

        // 网格
        const gridHelper = new THREE.GridHelper(10, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.2;
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // --- 变量 ---
        let currentModel = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 模式：'color' 或 'texture'
        let paintMode = 'color';

        // 当前导入的纹理图片对象 { image, dataURL, width, height }
        let importedTexture = null;

        // UI 元素
        const colorPicker = document.getElementById('colorPicker');
        const fileInput = document.getElementById('fileInput');
        const textureInput = document.getElementById('textureInput');
        const resetColorBtn = document.getElementById('resetColorBtn');
        const randomColorBtn = document.getElementById('randomColorBtn');
        const exportZipBtn = document.getElementById('exportZipBtn');
        const modeColorBtn = document.getElementById('modeColor');
        const modeTextureBtn = document.getElementById('modeTexture');

        // --- 模式切换 ---
        modeColorBtn.addEventListener('click', () => {
            paintMode = 'color';
            modeColorBtn.classList.add('active-mode');
            modeTextureBtn.classList.remove('active-mode');
            setStatus('已切换到颜色模式');
        });

        modeTextureBtn.addEventListener('click', () => {
            if (!importedTexture) {
                setStatus('请先导入一张纹理图片', true);
                return;
            }
            paintMode = 'texture';
            modeTextureBtn.classList.add('active-mode');
            modeColorBtn.classList.remove('active-mode');
            setStatus('已切换到纹理模式 · 点击面贴图');
        });

        // --- 导入纹理 ---
        textureInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                setStatus('请选择图片文件', true);
                return;
            }

            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    importedTexture = {
                        image: img,
                        dataURL: ev.target.result,
                        width: img.width,
                        height: img.height
                    };
                    // 更新预览
                    texturePreview.style.backgroundImage = `url(${ev.target.result})`;
                    texturePreview.classList.add('show');
                    // 自动切换到纹理模式
                    paintMode = 'texture';
                    modeTextureBtn.classList.add('active-mode');
                    modeColorBtn.classList.remove('active-mode');
                    setStatus(`纹理已导入: ${img.width}×${img.height} · 点击面贴图`);
                };
                img.onerror = () => setStatus('图片加载失败', true);
                img.src = ev.target.result;
            };
            reader.onerror = () => setStatus('图片读取失败', true);
            reader.readAsDataURL(file);
            textureInput.value = '';
        });

        // --- 创建默认模型 ---
        function createDefaultModel() {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const nonIndexedGeo = geometry.toNonIndexed();
            geometry.dispose();

            const posAttr = nonIndexedGeo.getAttribute('position');
            const vCount = posAttr.count;

            // 顶点颜色
            const colors = new Float32Array(vCount * 3);
            for (let i = 0; i < vCount; i++) {
                colors[i*3] = 0.85; colors[i*3+1] = 0.85; colors[i*3+2] = 0.85;
            }
            nonIndexedGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // UV（每个面赋予不同区域，方便预览）
            const uvs = new Float32Array(vCount * 2);
            for (let f = 0; f < vCount / 3; f++) {
                // 简单的 UV 分布
                const u = 0.5, v = 0.5;
                for (let k = 0; k < 3; k++) {
                    const idx = f * 3 + k;
                    uvs[idx * 2] = u;
                    uvs[idx * 2 + 1] = v;
                }
            }
            nonIndexedGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                flatShading: true,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });

            const cube = new THREE.Mesh(nonIndexedGeo, material);
            const group = new THREE.Group();
            group.add(cube);
            return group;
        }

        function disposeModel(model) {
            if (!model) return;
            model.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
        }

        function loadDefaultModel() {
            if (currentModel) {
                scene.remove(currentModel);
                disposeModel(currentModel);
            }
            currentModel = createDefaultModel();
            scene.add(currentModel);
            setStatus('默认立方体已加载 · 点击面涂色');
        }

        // --- 上传 OBJ ---
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);
            setStatus('正在加载 OBJ...');

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const contents = e.target.result;
                    const loader = new OBJLoader();
                    const obj = loader.parse(contents);

                    obj.traverse((child) => {
                        if (child.isMesh) {
                            let geometry = child.geometry;
                            if (geometry.index !== null) {
                                const newGeo = geometry.toNonIndexed();
                                geometry.dispose();
                                geometry = newGeo;
                            }

                            const posAttr = geometry.getAttribute('position');
                            if (!posAttr) return;
                            const vCount = posAttr.count;

                            // 颜色属性
                            if (!geometry.getAttribute('color')) {
                                const colors = new Float32Array(vCount * 3);
                                for (let i = 0; i < vCount; i++) {
                                    colors[i*3] = 0.85; colors[i*3+1] = 0.85; colors[i*3+2] = 0.85;
                                }
                                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                            }

                            // UV 属性（用于纹理模式）
                            if (!geometry.getAttribute('uv')) {
                                const uvs = new Float32Array(vCount * 2);
                                // 默认 UV 为 0.5, 0.5
                                for (let i = 0; i < vCount; i++) {
                                    uvs[i*2] = 0.5;
                                    uvs[i*2+1] = 0.5;
                                }
                                geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                            }

                            const newMaterial = new THREE.MeshStandardMaterial({
                                vertexColors: true,
                                flatShading: true,
                                roughness: 0.5,
                                metalness: 0.1,
                                side: THREE.DoubleSide,
                            });

                            child.geometry = geometry;
                            child.material = newMaterial;
                        }
                    });

                    if (currentModel) {
                        scene.remove(currentModel);
                        disposeModel(currentModel);
                    }

                    // 居中
                    const box = new THREE.Box3().setFromObject(obj);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    obj.position.x = -center.x;
                    obj.position.y = -center.y;
                    obj.position.z = -center.z;

                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0) {
                        const distance = maxDim * 1.8;
                        camera.position.set(distance * 0.8, distance * 0.6, distance);
                        controls.target.set(0, 0, 0);
                        controls.update();
                    }

                    currentModel = obj;
                    scene.add(obj);
                    setStatus(`已加载: ${file.name} | 面数: ${countFaces(obj)}`);
                } catch (error) {
                    console.error(error);
                    setStatus('OBJ 解析失败: ' + error.message, true);
                } finally {
                    showLoading(false);
                }
            };
            reader.onerror = () => {
                setStatus('文件读取失败', true);
                showLoading(false);
            };
            reader.readAsText(file);
            fileInput.value = '';
        });

        function countFaces(object) {
            let faces = 0;
            object.traverse(child => {
                if (child.isMesh) {
                    const geom = child.geometry;
                    if (geom.index) faces += geom.index.count / 3;
                    else {
                        const posAttr = geom.getAttribute('position');
                        if (posAttr) faces += posAttr.count / 3;
                    }
                }
            });
            return Math.floor(faces);
        }

        // --- 点击涂色/贴图 ---
        const pointerDownPos = new THREE.Vector2();
        const CLICK_THRESHOLD = 5;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointerDownPos.set(e.clientX, e.clientY);
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) < CLICK_THRESHOLD) {
                handlePaint(e);
            }
        });

        function handlePaint(event) {
            if (!currentModel) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const meshes = [];
            currentModel.traverse(child => {
                if (child.isMesh) meshes.push(child);
            });

            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const mesh = intersect.object;
                const faceIndex = intersect.faceIndex;
                const geometry = mesh.geometry;
                const posAttr = geometry.getAttribute('position');
                if (!posAttr) return;

                // 确保颜色属性存在
                let colorAttr = geometry.getAttribute('color');
                if (!colorAttr) {
                    const count = posAttr.count;
                    const colors = new Float32Array(count * 3);
                    for (let i = 0; i < count; i++) {
                        colors[i*3] = 0.85; colors[i*3+1] = 0.85; colors[i*3+2] = 0.85;
                    }
                    colorAttr = new THREE.BufferAttribute(colors, 3);
                    geometry.setAttribute('color', colorAttr);
                    mesh.material.vertexColors = true;
                    mesh.material.needsUpdate = true;
                }

                const startIdx = faceIndex * 3;
                if (startIdx + 3 > posAttr.count) return;

                if (paintMode === 'color') {
                    // --- 颜色模式：直接用颜色填充 ---
                    const color = new THREE.Color(colorPicker.value);
                    const colorArray = colorAttr.array;
                    for (let i = startIdx; i < startIdx + 3; i++) {
                        colorArray[i*3] = color.r;
                        colorArray[i*3+1] = color.g;
                        colorArray[i*3+2] = color.b;
                    }
                    colorAttr.needsUpdate = true;
                    setStatus(`已涂色: 面 #${faceIndex}`);
                } else if (paintMode === 'texture' && importedTexture) {
                    // --- 纹理模式：将导入的纹理的对应区域贴到该面 ---
                    // 使用顶点颜色来"贴"纹理：从导入的图片中采样一个颜色赋给该面
                    // 但这样会失去图案。更好的方案是修改 UV 指向纹理上的一个小区域，
                    // 但由于我们导出时需要合并纹理图集，我们采用另一种策略：
                    // 我们将该面标记为使用导入的纹理，并在导出时将导入的纹理拼接到图集中。
                    // 但在实时预览中，为了能看到效果，我们临时将材质切换到贴图模式不太现实（因为每个面不同纹理）。
                    // 
                    // 简化方案：在纹理模式下，我们采样导入纹理在面中心位置的颜色，将其作为该面的颜色。
                    // 这样虽然不能完全展示图案，但能体现出纹理的颜色倾向。对于导出，我们会将整个纹理图集包含进去。
                    // 更好的方案：为每个面分配纹理的一个区域，并将该区域的图案画到最终图集。但在实时预览中比较复杂。
                    // 
                    // 这里我采用一个平衡方案：在纹理模式下点击面时，根据面在模型上的位置（或面索引）
                    // 从导入纹理中取一个小块区域，然后把这个区域的颜色平均值赋给该面。
                    // 这样在颜色上能体现纹理，但图案会丢失。为了让导出的 ZIP 中真正包含图案，
                    // 我们会在导出时把导入的纹理作为背景，并把每个面的颜色作为覆盖层。
                    
                    // 取面中心的世界坐标决定纹理采样位置
                    const centerX = (posAttr.getX(startIdx) + posAttr.getX(startIdx+1) + posAttr.getX(startIdx+2)) / 3;
                    const centerY = (posAttr.getY(startIdx) + posAttr.getY(startIdx+1) + posAttr.getY(startIdx+2)) / 3;
                    
                    // 用简单映射将坐标映射到 UV [0,1]
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const size = box.getSize(new THREE.Vector3());
                    const min = box.min;
                    
                    let u = (centerX - min.x) / (size.x || 1);
                    let v = (centerY - min.y) / (size.y || 1);
                    u = Math.max(0, Math.min(1, u));
                    v = Math.max(0, Math.min(1, v));
                    
                    // 从导入的图片中采样一个颜色
                    const canvas = document.createElement('canvas');
                    canvas.width = 1;
                    canvas.height = 1;
                    const ctx = canvas.getContext('2d');
                    const img = importedTexture.image;
                    const sx = Math.floor(u * img.width);
                    const sy = Math.floor((1 - v) * img.height);
                    
                    ctx.drawImage(img, sx, sy, 1, 1, 0, 0, 1, 1);
                    const pixel = ctx.getImageData(0, 0, 1, 1).data;
                    const r = pixel[0] / 255;
                    const g = pixel[1] / 255;
                    const b = pixel[2] / 255;
                    
                    const colorArray = colorAttr.array;
                    for (let i = startIdx; i < startIdx + 3; i++) {
                        colorArray[i*3] = r;
                        colorArray[i*3+1] = g;
                        colorArray[i*3+2] = b;
                    }
                    colorAttr.needsUpdate = true;
                    setStatus(`已贴图: 面 #${faceIndex} · 采样颜色 (${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`);
                }
            }
        }

        // --- 重置颜色 ---
        resetColorBtn.addEventListener('click', () => {
            if (!currentModel) return;
            currentModel.traverse(child => {
                if (child.isMesh) {
                    const colorAttr = child.geometry.getAttribute('color');
                    if (colorAttr) {
                        const arr = colorAttr.array;
                        for (let i = 0; i < arr.length; i += 3) {
                            arr[i] = 0.85; arr[i+1] = 0.85; arr[i+2] = 0.85;
                        }
                        colorAttr.needsUpdate = true;
                    }
                }
            });
            setStatus('颜色已重置');
        });

        // --- 随机上色 ---
        randomColorBtn.addEventListener('click', () => {
            if (!currentModel) return;
            currentModel.traverse(child => {
                if (child.isMesh) {
                    const geometry = child.geometry;
                    const posAttr = geometry.getAttribute('position');
                    if (!posAttr) return;

                    let colorAttr = geometry.getAttribute('color');
                    if (!colorAttr) {
                        const count = posAttr.count;
                        const colors = new Float32Array(count * 3);
                        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                        colorAttr = geometry.getAttribute('color');
                        child.material.vertexColors = true;
                        child.material.needsUpdate = true;
                    }

                    const arr = colorAttr.array;
                    for (let i = 0; i < posAttr.count; i += 3) {
                        const r = Math.random(), g = Math.random(), b = Math.random();
                        for (let j = 0; j < 3; j++) {
                            const idx = i + j;
                            if (idx < posAttr.count) {
                                arr[idx*3] = r; arr[idx*3+1] = g; arr[idx*3+2] = b;
                            }
                        }
                    }
                    colorAttr.needsUpdate = true;
                }
            });
            setStatus('随机上色完成');
        });

        // --- 导出 ZIP ---
        exportZipBtn.addEventListener('click', async () => {
            if (!currentModel) {
                setStatus('没有模型可导出', true);
                return;
            }
            if (!JSZip || !saveAs) {
                setStatus('导出依赖加载失败，请刷新页面', true);
                return;
            }

            showLoading(true);
            setStatus('正在生成导出文件...');

            try {
                const meshes = [];
                currentModel.traverse(child => {
                    if (child.isMesh) meshes.push(child);
                });

                if (meshes.length === 0) {
                    setStatus('模型中没有网格', true);
                    showLoading(false);
                    return;
                }

                // 计算总面数
                let totalFaces = 0;
                meshes.forEach(mesh => {
                    const posAttr = mesh.geometry.getAttribute('position');
                    if (posAttr) totalFaces += posAttr.count / 3;
                });
                totalFaces = Math.floor(totalFaces);

                if (totalFaces === 0) {
                    setStatus('模型面数为0', true);
                    showLoading(false);
                    return;
                }

                // 纹理图集布局
                const cols = Math.ceil(Math.sqrt(totalFaces));
                const rows = Math.ceil(totalFaces / cols);
                const texSize = Math.min(4096, Math.max(512, cols * 20));
                const cellW = texSize / cols;
                const cellH = texSize / rows;

                const canvas = document.createElement('canvas');
                canvas.width = texSize;
                canvas.height = texSize;
                const ctx = canvas.getContext('2d');

                // 如果有导入纹理，先平铺到画布作为背景
                if (importedTexture) {
                    ctx.drawImage(importedTexture.image, 0, 0, texSize, texSize);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, texSize, texSize);
                }

                // 导出数据准备
                let globalFaceIdx = 0;
                const vertexLines = [];
                const uvLines = [];
                const normalLines = [];
                const faceLines = [];
                let vOffset = 1, vtOffset = 1, vnOffset = 1;

                meshes.forEach(mesh => {
                    const geometry = mesh.geometry;
                    const posAttr = geometry.getAttribute('position');
                    const normalAttr = geometry.getAttribute('normal');
                    const colorAttr = geometry.getAttribute('color');
                    if (!posAttr) return;

                    const vCount = posAttr.count;

                    // UV 属性
                    let uvAttr = geometry.getAttribute('uv');
                    if (!uvAttr) {
                        const uvs = new Float32Array(vCount * 2);
                        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                        uvAttr = geometry.getAttribute('uv');
                    }
                    const uvArray = uvAttr.array;

                    // 顶点
                    for (let i = 0; i < vCount; i++) {
                        vertexLines.push(`v ${posAttr.getX(i).toFixed(6)} ${posAttr.getY(i).toFixed(6)} ${posAttr.getZ(i).toFixed(6)}`);
                    }

                    // 法线
                    if (normalAttr) {
                        for (let i = 0; i < vCount; i++) {
                            normalLines.push(`vn ${normalAttr.getX(i).toFixed(6)} ${normalAttr.getY(i).toFixed(6)} ${normalAttr.getZ(i).toFixed(6)}`);
                        }
                    }

                    // 逐面
                    const faceCount = vCount / 3;
                    for (let f = 0; f < faceCount; f++) {
                        const gf = globalFaceIdx + f;
                        const col = gf % cols;
                        const row = Math.floor(gf / cols);
                        const u = (col + 0.5) / cols;
                        const v = 1.0 - (row + 0.5) / rows;

                        // 设置 UV
                        for (let k = 0; k < 3; k++) {
                            const idx = f * 3 + k;
                            uvArray[idx*2] = u;
                            uvArray[idx*2+1] = v;
                            uvLines.push(`vt ${u.toFixed(6)} ${v.toFixed(6)}`);
                        }

                        // 取颜色
                        let r = 0.85, g = 0.85, b = 0.85;
                        if (colorAttr) {
                            const ci = f * 3;
                            if (ci < colorAttr.array.length / 3) {
                                r = colorAttr.array[ci*3];
                                g = colorAttr.array[ci*3+1];
                                b = colorAttr.array[ci*3+2];
                            }
                        }

                        // 绘制面颜色到图集（以半透明方式叠加，保留底层纹理）
                        ctx.fillStyle = `rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},0.85)`;
                        ctx.fillRect(col * cellW, row * cellH, cellW, cellH);

                        // 面数据
                        const v1 = vOffset + f * 3;
                        const v2 = vOffset + f * 3 + 1;
                        const v3 = vOffset + f * 3 + 2;
                        const vt1 = vtOffset + f * 3;
                        const vt2 = vtOffset + f * 3 + 1;
                        const vt3 = vtOffset + f * 3 + 2;

                        if (normalAttr) {
                            const vn1 = vnOffset + f * 3;
                            const vn2 = vnOffset + f * 3 + 1;
                            const vn3 = vnOffset + f * 3 + 2;
                            faceLines.push(`f ${v1}/${vt1}/${vn1} ${v2}/${vt2}/${vn2} ${v3}/${vt3}/${vn3}`);
                        } else {
                            faceLines.push(`f ${v1}/${vt1} ${v2}/${vt2} ${v3}/${vt3}`);
                        }
                    }

                    uvAttr.needsUpdate = true;
                    vOffset += vCount;
                    vtOffset += vCount;
                    if (normalAttr) vnOffset += vCount;
                    globalFaceIdx += faceCount;
                });

                // MTL
                const mtlContent = `# MTL generated by OBJ Colorizer
newmtl material_0
Ka 1.000 1.000 1.000
Kd 1.000 1.000 1.000
Ks 0.000 0.000 0.000
d 1.0
illum 2
map_Kd texture.png
`;

                // OBJ
                let objContent = `# OBJ generated by OBJ Colorizer
mtllib model.mtl
`;
                objContent += vertexLines.join('\n') + '\n';
                objContent += uvLines.join('\n') + '\n';
                if (normalLines.length > 0) {
                    objContent += normalLines.join('\n') + '\n';
                }
                objContent += 'g model\n';
                objContent += 'usemtl material_0\n';
                objContent += faceLines.join('\n') + '\n';

                // PNG
                const pngBlob = await new Promise((resolve, reject) => {
                    canvas.toBlob(blob => {
                        if (blob) resolve(blob);
                        else reject(new Error('Canvas 转 PNG 失败'));
                    }, 'image/png');
                });

                // ZIP
                const zip = new JSZip();
                zip.file('model.obj', objContent);
                zip.file('model.mtl', mtlContent);
                zip.file('texture.png', pngBlob);
                if (importedTexture) {
                    // 同时导出原始纹理，方便参考
                    const base64Data = importedTexture.dataURL.split(',')[1];
                    zip.file('original_texture.png', base64Data, { base64: true });
                }

                const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
                saveAs(content, 'colored_model.zip');

                setStatus('导出成功！ZIP 已下载');
            } catch (err) {
                console.error(err);
                setStatus('导出失败: ' + err.message, true);
            } finally {
                showLoading(false);
            }
        });

        // --- 初始化 ---
        loadDefaultModel();
        setStatus('就绪 · 点击面涂色或导入纹理');

        // --- 窗口大小 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
