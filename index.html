<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJ 上色器 - 带导出ZIP功能</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111122;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
            border-left: 4px solid #ffaa00;
            font-size: 15px;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 40, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 18px 28px;
            border-radius: 60px;
            display: flex;
            gap: 25px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-group label {
            font-size: 13px;
            font-weight: 500;
            color: #bbb;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        input[type="color"] {
            width: 45px;
            height: 45px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 2px;
            transition: transform 0.2s, border-color 0.2s;
        }
        input[type="color"]:hover {
            transform: scale(1.05);
            border-color: #ffaa00;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        button {
            background: #ffaa00;
            border: none;
            color: #1a1a1a;
            font-weight: bold;
            padding: 11px 22px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(255,170,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
        }
        button:hover {
            background: #ffbb22;
            box-shadow: 0 6px 15px rgba(255,170,0,0.5);
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .file-upload-wrapper {
            position: relative;
            display: inline-block;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        .file-upload-btn {
            background: #3a3a4a;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 11px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            display: inline-block;
        }
        .file-upload-btn:hover { background: #4a4a5a; }
        .export-btn {
            background: #2e8b57;
            color: white;
            box-shadow: 0 4px 10px rgba(46,139,87,0.3);
        }
        .export-btn:hover {
            background: #3cb371;
            box-shadow: 0 6px 15px rgba(46,139,87,0.5);
        }
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(5px);
            font-family: monospace;
            border-left: 3px solid #0f0;
            z-index: 10;
            max-width: 40vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa00;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 12px;
            pointer-events: none;
            display: none;
        }
        @media (max-width: 900px) {
            #controls { flex-direction: column; padding: 15px; border-radius: 30px; gap: 12px; }
            .control-group { flex-wrap: wrap; justify-content: center; }
            #info { font-size: 12px; padding: 8px 14px; }
            #status { font-size: 11px; max-width: 50vw; }
            button { padding: 9px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="info">🎨 OBJ 上色器 · 点击面涂色 · 可导出ZIP</div>
    <div id="status">初始化中...</div>
    <div id="loading">⏳ 加载中...</div>

    <div id="controls">
        <div class="control-group">
            <label>画笔颜色</label>
            <input type="color" id="colorPicker" value="#ff5500">
        </div>
        
        <div class="file-upload-wrapper">
            <button class="file-upload-btn">📂 上传 OBJ</button>
            <input type="file" id="fileInput" accept=".obj">
        </div>

        <div class="control-group">
            <button id="resetColorBtn">🔄 重置</button>
            <button id="randomColorBtn">🎲 随机</button>
            <button id="exportZipBtn" class="export-btn">📦 导出 ZIP</button>
        </div>
    </div>

    <!-- 先引入 JSZip 和 FileSaver 为全局变量，避免模块导入问题 -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <!-- Three.js 使用 importmap -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // 从全局获取 JSZip 和 saveAs（因为通过 <script> 标签加载，不在模块作用域内）
        const JSZip = window.JSZip;
        const saveAs = window.saveAs;

        // 检查依赖是否加载成功
        if (!JSZip) {
            console.error('JSZip 加载失败');
            document.getElementById('status').textContent = 'JSZip 加载失败，请刷新页面';
        }
        if (!saveAs) {
            console.error('FileSaver 加载失败');
        }

        // --- 状态显示辅助 ---
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        function setStatus(text, isError = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = isError ? '#ff5555' : '#0f0';
            statusDiv.style.borderLeftColor = isError ? '#ff5555' : '#0f0';
        }
        function showLoading(show) {
            loadingDiv.style.display = show ? 'block' : 'none';
        }

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxDistance = 30;
        controls.minDistance = 0.5;
        controls.target.set(0, 0, 0);

        // 光照
        scene.add(new THREE.AmbientLight(0x404060));
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight1.position.set(2, 5, 3);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0xffaa88, 0.8);
        dirLight2.position.set(-3, 1, -2);
        scene.add(dirLight2);
        const pointLight = new THREE.PointLight(0x4466ff, 0.5);
        pointLight.position.set(1, 2, 4);
        scene.add(pointLight);

        // 网格地面
        const gridHelper = new THREE.GridHelper(10, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.2;
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // 状态变量
        let currentModel = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // UI 元素
        const colorPicker = document.getElementById('colorPicker');
        const fileInput = document.getElementById('fileInput');
        const resetColorBtn = document.getElementById('resetColorBtn');
        const randomColorBtn = document.getElementById('randomColorBtn');
        const exportZipBtn = document.getElementById('exportZipBtn');

        // --- 创建默认模型 ---
        function createDefaultModel() {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const nonIndexedGeo = geometry.toNonIndexed();
            geometry.dispose();

            const positionAttribute = nonIndexedGeo.getAttribute('position');
            const vertexCount = positionAttribute.count;
            const colors = new Float32Array(vertexCount * 3);

            for (let i = 0; i < vertexCount; i++) {
                colors[i * 3] = 0.85;
                colors[i * 3 + 1] = 0.85;
                colors[i * 3 + 2] = 0.85;
            }

            nonIndexedGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                flatShading: true,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });

            const cube = new THREE.Mesh(nonIndexedGeo, material);
            const group = new THREE.Group();
            group.add(cube);
            return group;
        }

        // --- 释放旧模型 ---
        function disposeModel(model) {
            if (!model) return;
            model.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
        }

        // --- 加载默认模型 ---
        function loadDefaultModel() {
            if (currentModel) {
                scene.remove(currentModel);
                disposeModel(currentModel);
            }
            currentModel = createDefaultModel();
            scene.add(currentModel);
            setStatus('默认立方体已加载 · 点击面涂色');
        }

        // --- 处理 OBJ 上传 ---
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);
            setStatus('正在加载 OBJ...');

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const contents = e.target.result;
                    const loader = new OBJLoader();
                    const obj = loader.parse(contents);

                    obj.traverse((child) => {
                        if (child.isMesh) {
                            let geometry = child.geometry;
                            if (geometry.index !== null) {
                                const newGeo = geometry.toNonIndexed();
                                geometry.dispose();
                                geometry = newGeo;
                            }

                            const positionAttribute = geometry.getAttribute('position');
                            if (!positionAttribute) return;

                            const vertexCount = positionAttribute.count;

                            if (!geometry.getAttribute('color')) {
                                const colors = new Float32Array(vertexCount * 3);
                                for (let i = 0; i < vertexCount; i++) {
                                    colors[i * 3] = 0.85;
                                    colors[i * 3 + 1] = 0.85;
                                    colors[i * 3 + 2] = 0.85;
                                }
                                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                            }

                            const newMaterial = new THREE.MeshStandardMaterial({
                                vertexColors: true,
                                flatShading: true,
                                roughness: 0.5,
                                metalness: 0.1,
                                side: THREE.DoubleSide,
                            });

                            child.geometry = geometry;
                            child.material = newMaterial;
                        }
                    });

                    if (currentModel) {
                        scene.remove(currentModel);
                        disposeModel(currentModel);
                    }

                    // 居中模型
                    const box = new THREE.Box3().setFromObject(obj);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    obj.position.x = -center.x;
                    obj.position.y = -center.y;
                    obj.position.z = -center.z;

                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0) {
                        const distance = maxDim * 1.8;
                        camera.position.set(distance * 0.8, distance * 0.6, distance);
                        controls.target.set(0, 0, 0);
                        controls.update();
                    }

                    currentModel = obj;
                    scene.add(obj);
                    setStatus(`已加载: ${file.name} | 面数: ${countFaces(obj)}`);
                } catch (error) {
                    console.error(error);
                    setStatus('OBJ 解析失败: ' + error.message, true);
                } finally {
                    showLoading(false);
                }
            };
            reader.onerror = () => {
                setStatus('文件读取失败', true);
                showLoading(false);
            };
            reader.readAsText(file);
            fileInput.value = '';
        });

        function countFaces(object) {
            let faces = 0;
            object.traverse(child => {
                if (child.isMesh) {
                    const geom = child.geometry;
                    if (geom.index) {
                        faces += geom.index.count / 3;
                    } else {
                        const posAttr = geom.getAttribute('position');
                        if (posAttr) faces += posAttr.count / 3;
                    }
                }
            });
            return Math.floor(faces);
        }

        // --- 点击涂色 ---
        const pointerDownPos = new THREE.Vector2();
        const CLICK_THRESHOLD = 5;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointerDownPos.set(e.clientX, e.clientY);
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const dx = e.clientX - pointerDownPos.x;
            const dy = e.clientY - pointerDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) < CLICK_THRESHOLD) {
                handlePaint(e);
            }
        });

        function handlePaint(event) {
            if (!currentModel) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const meshes = [];
            currentModel.traverse(child => {
                if (child.isMesh) meshes.push(child);
            });

            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const mesh = intersect.object;
                const faceIndex = intersect.faceIndex;

                const geometry = mesh.geometry;
                const positionAttribute = geometry.getAttribute('position');
                if (!positionAttribute) return;

                let colorAttribute = geometry.getAttribute('color');
                if (!colorAttribute) {
                    const count = positionAttribute.count;
                    const colors = new Float32Array(count * 3);
                    for (let i = 0; i < count; i++) {
                        colors[i * 3] = 0.85;
                        colors[i * 3 + 1] = 0.85;
                        colors[i * 3 + 2] = 0.85;
                    }
                    colorAttribute = new THREE.BufferAttribute(colors, 3);
                    geometry.setAttribute('color', colorAttribute);
                    mesh.material.vertexColors = true;
                    mesh.material.needsUpdate = true;
                }

                const color = new THREE.Color(colorPicker.value);
                const startIdx = faceIndex * 3;

                if (startIdx + 3 > positionAttribute.count) return;

                const colorArray = colorAttribute.array;
                for (let i = startIdx; i < startIdx + 3; i++) {
                    colorArray[i * 3] = color.r;
                    colorArray[i * 3 + 1] = color.g;
                    colorArray[i * 3 + 2] = color.b;
                }
                colorAttribute.needsUpdate = true;
                setStatus(`已涂色: 面 #${faceIndex}`);
            }
        }

        // --- 重置颜色 ---
        resetColorBtn.addEventListener('click', () => {
            if (!currentModel) return;
            currentModel.traverse(child => {
                if (child.isMesh) {
                    const colorAttribute = child.geometry.getAttribute('color');
                    if (colorAttribute) {
                        const colorArray = colorAttribute.array;
                        for (let i = 0; i < colorArray.length; i += 3) {
                            colorArray[i] = 0.85;
                            colorArray[i + 1] = 0.85;
                            colorArray[i + 2] = 0.85;
                        }
                        colorAttribute.needsUpdate = true;
                    }
                }
            });
            setStatus('颜色已重置');
        });

        // --- 随机上色 ---
        randomColorBtn.addEventListener('click', () => {
            if (!currentModel) return;
            currentModel.traverse(child => {
                if (child.isMesh) {
                    const geometry = child.geometry;
                    const positionAttribute = geometry.getAttribute('position');
                    if (!positionAttribute) return;

                    let colorAttribute = geometry.getAttribute('color');
                    if (!colorAttribute) {
                        const count = positionAttribute.count;
                        const colors = new Float32Array(count * 3);
                        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                        colorAttribute = geometry.getAttribute('color');
                        child.material.vertexColors = true;
                        child.material.needsUpdate = true;
                    }

                    const colorArray = colorAttribute.array;
                    for (let i = 0; i < positionAttribute.count; i += 3) {
                        const r = Math.random();
                        const g = Math.random();
                        const b = Math.random();
                        for (let j = 0; j < 3; j++) {
                            const idx = i + j;
                            if (idx < positionAttribute.count) {
                                colorArray[idx * 3] = r;
                                colorArray[idx * 3 + 1] = g;
                                colorArray[idx * 3 + 2] = b;
                            }
                        }
                    }
                    colorAttribute.needsUpdate = true;
                }
            });
            setStatus('随机上色完成');
        });

        // --- 导出 ZIP ---
        exportZipBtn.addEventListener('click', async () => {
            if (!currentModel) {
                setStatus('没有模型可导出', true);
                return;
            }
            if (!JSZip || !saveAs) {
                setStatus('导出依赖加载失败，请刷新页面', true);
                return;
            }

            showLoading(true);
            setStatus('正在生成导出文件...');

            try {
                // 收集所有 Mesh
                const meshes = [];
                currentModel.traverse(child => {
                    if (child.isMesh) meshes.push(child);
                });

                if (meshes.length === 0) {
                    setStatus('模型中没有网格', true);
                    showLoading(false);
                    return;
                }

                // 计算总面数
                let totalFaces = 0;
                meshes.forEach(mesh => {
                    const geom = mesh.geometry;
                    const posAttr = geom.getAttribute('position');
                    if (posAttr) totalFaces += posAttr.count / 3;
                });
                totalFaces = Math.floor(totalFaces);
                if (totalFaces === 0) {
                    setStatus('模型面数为0', true);
                    showLoading(false);
                    return;
                }

                // 纹理图集布局
                const cols = Math.ceil(Math.sqrt(totalFaces));
                const rows = Math.ceil(totalFaces / cols);
                const texSize = Math.min(4096, Math.max(512, cols * 16));
                const cellW = texSize / cols;
                const cellH = texSize / rows;

                const canvas = document.createElement('canvas');
                canvas.width = texSize;
                canvas.height = texSize;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, texSize, texSize);

                // 准备数据
                let globalFaceIdx = 0;
                const vertexLines = [];
                const uvLines = [];
                const normalLines = [];
                const faceLines = [];
                let vOffset = 1, vtOffset = 1, vnOffset = 1;

                meshes.forEach(mesh => {
                    const geometry = mesh.geometry;
                    const posAttr = geometry.getAttribute('position');
                    const normalAttr = geometry.getAttribute('normal');
                    const colorAttr = geometry.getAttribute('color');
                    if (!posAttr) return;

                    const vCount = posAttr.count;

                    // UV 属性：如果没有则创建
                    let uvAttr = geometry.getAttribute('uv');
                    if (!uvAttr) {
                        const uvs = new Float32Array(vCount * 2);
                        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                        uvAttr = geometry.getAttribute('uv');
                    }
                    const uvArray = uvAttr.array;

                    // 写入顶点
                    for (let i = 0; i < vCount; i++) {
                        vertexLines.push(`v ${posAttr.getX(i).toFixed(6)} ${posAttr.getY(i).toFixed(6)} ${posAttr.getZ(i).toFixed(6)}`);
                    }

                    // 写入法线
                    if (normalAttr) {
                        for (let i = 0; i < vCount; i++) {
                            normalLines.push(`vn ${normalAttr.getX(i).toFixed(6)} ${normalAttr.getY(i).toFixed(6)} ${normalAttr.getZ(i).toFixed(6)}`);
                        }
                    }

                    // 逐面处理
                    const faceCount = vCount / 3;
                    for (let f = 0; f < faceCount; f++) {
                        const gf = globalFaceIdx + f;
                        const col = gf % cols;
                        const row = Math.floor(gf / cols);

                        const u = (col + 0.5) / cols;
                        const v = 1.0 - (row + 0.5) / rows;

                        // 设置 UV
                        for (let k = 0; k < 3; k++) {
                            const idx = f * 3 + k;
                            uvArray[idx * 2] = u;
                            uvArray[idx * 2 + 1] = v;
                            uvLines.push(`vt ${u.toFixed(6)} ${v.toFixed(6)}`);
                        }

                        // 取颜色
                        let r = 0.85, g = 0.85, b = 0.85;
                        if (colorAttr) {
                            const ci = f * 3;
                            if (ci < colorAttr.array.length / 3) {
                                r = colorAttr.array[ci * 3];
                                g = colorAttr.array[ci * 3 + 1];
                                b = colorAttr.array[ci * 3 + 2];
                            }
                        }

                        // 绘制到纹理
                        ctx.fillStyle = `rgb(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)})`;
                        ctx.fillRect(col * cellW, row * cellH, cellW, cellH);

                        // 面
                        const v1 = vOffset + f * 3;
                        const v2 = vOffset + f * 3 + 1;
                        const v3 = vOffset + f * 3 + 2;
                        const vt1 = vtOffset + f * 3;
                        const vt2 = vtOffset + f * 3 + 1;
                        const vt3 = vtOffset + f * 3 + 2;

                        if (normalAttr) {
                            const vn1 = vnOffset + f * 3;
                            const vn2 = vnOffset + f * 3 + 1;
                            const vn3 = vnOffset + f * 3 + 2;
                            faceLines.push(`f ${v1}/${vt1}/${vn1} ${v2}/${vt2}/${vn2} ${v3}/${vt3}/${vn3}`);
                        } else {
                            faceLines.push(`f ${v1}/${vt1} ${v2}/${vt2} ${v3}/${vt3}`);
                        }
                    }

                    uvAttr.needsUpdate = true;
                    vOffset += vCount;
                    vtOffset += vCount;
                    if (normalAttr) vnOffset += vCount;
                    globalFaceIdx += faceCount;
                });

                // 生成 MTL
                const mtlContent = `# MTL generated by OBJ Colorizer
newmtl material_0
Ka 1.000 1.000 1.000
Kd 1.000 1.000 1.000
Ks 0.000 0.000 0.000
d 1.0
illum 2
map_Kd texture.png
`;

                // 组装 OBJ
                let objContent = `# OBJ generated by OBJ Colorizer
mtllib model.mtl
`;
                objContent += vertexLines.join('\n') + '\n';
                objContent += uvLines.join('\n') + '\n';
                if (normalLines.length > 0) {
                    objContent += normalLines.join('\n') + '\n';
                }
                objContent += 'g model\n';
                objContent += 'usemtl material_0\n';
                objContent += faceLines.join('\n') + '\n';

                // 生成 PNG Blob
                const pngBlob = await new Promise((resolve, reject) => {
                    canvas.toBlob(blob => {
                        if (blob) resolve(blob);
                        else reject(new Error('Canvas 转 PNG 失败'));
                    }, 'image/png');
                });

                // 打包 ZIP
                const zip = new JSZip();
                zip.file('model.obj', objContent);
                zip.file('model.mtl', mtlContent);
                zip.file('texture.png', pngBlob);

                const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
                saveAs(content, 'colored_model.zip');

                setStatus('导出成功！ZIP 已下载');
            } catch (err) {
                console.error(err);
                setStatus('导出失败: ' + err.message, true);
            } finally {
                showLoading(false);
            }
        });

        // --- 初始化 ---
        loadDefaultModel();
        setStatus('就绪 · 点击模型面涂色');

        // --- 窗口大小调整 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
